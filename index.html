<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index App</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      background-color: #f4f6fb;
      color: #1f2937;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
    }

    .app-shell {
      width: min(100%, 720px);
      margin: 24px;
      padding: 32px;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 18px 60px rgba(15, 23, 42, 0.08);
    }

    .app-shell h1 {
      margin: 0 0 12px;
      font-size: 2rem;
    }

    .app-shell p {
      margin: 0 0 24px;
      line-height: 1.6;
      color: #475569;
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      background-color: #4338ca;
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
      text-decoration: none;
    }

    .action-button:hover {
      transform: translateY(-2px);
      background-color: #3730a3;
    }

    .status {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #eef2ff;
      color: #1e3a8a;
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <h1>Index App</h1>
    <p>Welcome to the app shell. This page includes the styles and layout for your <code>index.js</code> script.</p>
    <button class="action-button" id="actionButton">Run Action</button>
    <div class="status" id="status">Status: Ready</div>
  </main>

  <script src="index.js"></script>
</body>
</html>
